<!DOCTYPE html>
<html lang="en">

<head>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Ayan's Portfolio</title>
</head>

<body class="text-white select-none" oncontextmenu="return false;" ondragstart="return false;">


    <nav
        class="fixed w-full bg-gradient-to-r from-gray-950 via-gray-700 to-gray-950 flex items-center justify-between lg:justify-around lg:gap-68 px-8 py-4 border-b-2 border-gray-500">
        <div class="text-4xl font-bold cursor-pointer hover:text-sky-400">Ayan</div>
        <button id="hamburger" class="lg:hidden text-white text-2xl"><i class="fas fa-bars"></i></button>
        <div id="mobile-menu"
            class="hidden lg:flex flex-col lg:flex-row gap-4 lg:gap-20 text-white absolute lg:relative top-full lg:top-auto left-0 lg:left-auto w-full lg:w-auto bg-gray-950 lg:bg-transparent p-4 lg:p-0">
            <a href="#home" class="font-semibold cursor-pointer relative after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-[540ms] hover:after:w-full">Home</a>
            <a href="#about" class="font-semibold cursor-pointer relative after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-[540ms] hover:after:w-full">About</a>
            <a href="#projects" class="font-semibold cursor-pointer relative after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-[540ms] hover:after:w-full">Projects</a>
            <a href="#contact" class="font-semibold cursor-pointer relative after:absolute after:bottom-0 after:left-1/2 after:-translate-x-1/2 after:h-[2px] after:w-0 after:bg-white after:transition-all after:duration-[540ms] hover:after:w-full">Contact</a>
        </div>
    </nav>
    <main class="pt-12">

        <!-- Homesection -->
        
            <section id="home"
            class="pt-8 sm:pt-12 sm:p-10 sm:pl-3 gap-5 lg:px-16 md:px-8 flex flex-col lg:flex-row md:flex-row lg:justify-between md:justify-between justify-center lg:pr-16 items-center h-screen bg-[url('./img/bag-img.jfif')] bg-cover bg-center bg-black/60 bg-blend-overlay ">
            <div class="lg:w-2/7 lg:h-72 md:w-2/7 md:h-60 order-1 md:order-2 sm:w-2/6 h-60  ">
                <img src="./img/pic.jpeg" alt="" class="w-full h-full">
            </div>
            <div class="order-2 md:order-1 lg:ml-0 md:ml-0 text-center">
                <div class="pr-4 lg:border-b md:border-b border-gray-500 lg:ml-0 md:ml-0 sm:ml-0">
                    <h1 class="font-mono font-semibold lg:text-6xl md:text-5xl sm:text-4xl text-3xl leading-normal"><span class="lg:ml-0 md:ml-0 sm:ml-0">Hi,
                            I am Ayan</span> <br> Frontend Developer</h1>
                </div>
                <div>
                    <p class="lg:border-t-0 md:border-t-0 border-t border-gray-500 lg:text-lg md:text-lg text-md mt-4 tracking-wider flex lg:ml-0 md:ml-0 sm:ml-0">I build modern
                        websites using HTML, CSS, Tailwind CSS and basic
                        javascript.
                    </p>
                </div>
                <div class="flex gap-4 mt-6 lg:ml-0 md:ml-0 sm:ml-0 justify-center">
                    <button class="bg-blue-950 p-3 cursor-pointer flex items-center gap-2 transition-transform transition-colors duration-300 hover:scale-105 hover:bg-blue-800"><a href="#Projects"
                            class="text-white">view Projects <i class="fa-solid fa-arrow-right"></i></a></button>
                    <button class="bg-gray-800 p-3 cursor-pointer flex items-center gap-2 transition-transform transition-colors duration-300 hover:scale-105 hover:bg-gray-700"><a href="#Contact"
                            class="text-white">Contact Me <i class="fa-solid fa-phone"></i></a></button>
                </div>
            </div>
        </section>


        <section >

            

            
        </section>



    



    
    </main>

    <script>
        document.getElementById('hamburger').addEventListener('click', function () {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        });
        // prevent copying via keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'x' || e.key === 'a')) {
                e.preventDefault();
            }
        });
    </script>
</body>

</html>
